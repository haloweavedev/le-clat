<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Le Clat</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #FEFEFE;
            --text-primary: #1c1c1c;
            --accent-gold: #C9A980;
            --accent-blush: #E8D5C4;
            --accent-ivory: #F5F0EB;
        }

        body {
            font-family: "Roboto", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .cormorant-light { font-family: "Cormorant Garamond", serif; font-weight: 300; }
        .cormorant-regular { font-family: "Cormorant Garamond", serif; font-weight: 400; }
        .cormorant-medium { font-family: "Cormorant Garamond", serif; font-weight: 500; }

        /* Navigation (Simplified) */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1100;
            background: rgba(254, 254, 254, 0.98);
            box-shadow: 0 18px 55px rgba(17, 12, 9, 0.08);
            padding: 20px 40px;
            display: flex;
            justify-content: center;
        }

        .brand-mark img {
            height: 56px;
            width: auto;
            display: block;
        }

        /* Hero Section */
        .thank-you-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 80px;
            background: radial-gradient(circle at center, var(--accent-ivory) 0%, var(--bg-primary) 70%);
        }

        .thank-you-title {
            font-size: 64px;
            line-height: 1.1;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .thank-you-message {
            font-size: 18px;
            font-weight: 300;
            max-width: 600px;
            margin-bottom: 40px;
            color: #555;
        }

        .home-btn {
            padding: 16px 40px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: 1px solid var(--text-primary);
            transition: all 0.4s ease;
            display: inline-block;
        }

        .home-btn:hover {
            background: transparent;
            color: var(--text-primary);
        }

        /* Footer */
        footer {
            padding: 60px 40px;
            background: var(--accent-ivory);
            text-align: center;
        }

        .footer-logo img {
            height: 40px;
            width: auto;
            margin-bottom: 20px;
        }

        .footer-info {
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            .thank-you-title {
                font-size: 42px;
            }
            .thank-you-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand-mark" href="index.html">
            <img src="images/logo.png" alt="Le Clat logo">
        </a>
    </header>

    <section class="thank-you-hero">
        <h1 class="thank-you-title cormorant-light">Thank You</h1>
        <p class="thank-you-message">Your request has been received. Our concierge team will review your details and get back to you shortly to confirm your appointment.</p>
        <a href="index.html" class="home-btn">Return to Home</a>
    </section>

    <footer>
        <div class="footer-logo">
            <img src="images/logo.png" alt="Le Clat insignia">
        </div>
        <p class="footer-info">&copy; 2025 Le Clat. All Rights Reserved.</p>
    </footer>
</body>
</html>
